<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Жигули Кликер</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    background: linear-gradient(180deg, #14142b 0%, #1a1a3e 60%, #1e2a52 100%);
    color:#fff; min-height:100vh; display:flex; flex-direction:column; overflow:hidden;
    user-select:none;
  }
  .app { flex:1; display:flex; flex-direction:column; overflow:hidden; }

  /* ---------- ВКЛАДКА ТАПАТЬ ---------- */
  .tap-screen { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:16px; }
  h1 { font-size:22px; }
  .score { font-size:52px; font-weight:800; color:#ffd54a; text-shadow:0 2px 12px rgba(255,200,60,.35); }
  .per-tap { font-size:14px; color:#aab; }
  .car-circle {
    width:230px; height:230px; border-radius:50%;
    background: radial-gradient(circle at 50% 35%, #2c2c55, #1c1c3a 70%);
    border:3px solid #ffb43a; box-shadow:0 0 40px rgba(255,180,58,.25), inset 0 0 30px rgba(0,0,0,.5);
    display:flex; align-items:center; justify-content:center; font-size:78px; cursor:pointer;
    transition:transform .08s; touch-action:manipulation;
  }
  .car-circle:active { transform:scale(.94); }
  .float { position:fixed; font-size:20px; color:#ffd54a; font-weight:700; pointer-events:none; animation:fly .8s ease-out forwards; z-index:99; }
  @keyframes fly { to { transform:translateY(-70px); opacity:0; } }

  /* ---------- ЭКРАНЫ ГАРАЖА / ТЮНИНГА / ТОПА ---------- */
  .screen { flex:1; overflow-y:auto; padding:16px; display:none; }
  .screen.active { display:block; }
  .screen h2 { margin-bottom:12px; font-size:18px; }
  .car-card, .tune-card {
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12);
    border-radius:14px; padding:12px 14px; margin-bottom:10px;
  }
  .car-card.owned { border-color:#4caf78; background:rgba(76,175,120,.12); }
  .car-card.locked { opacity:.55; }
  .car-name { font-weight:700; font-size:16px; }
  .car-price { color:#ffd54a; font-size:14px; margin-top:4px; }
  .owned-tag { color:#4caf78; font-size:13px; }
  .tune-title { font-weight:700; font-size:16px; display:flex; justify-content:space-between; }
  .tune-lvl { color:#8ab4ff; font-size:13px; }
  .tune-desc { font-size:13px; color:#aab; margin:6px 0 8px; }
  .buy-btn {
    background:#ffb43a; border:none; color:#1a1a2e; font-weight:700; font-size:14px;
    padding:8px 16px; border-radius:10px; cursor:pointer; font-family:inherit;
  }
  .buy-btn:disabled { background:#555; color:#999; cursor:default; }
  .empty { color:#889; font-size:14px; text-align:center; padding:30px 10px; }

  /* ---------- НИЖНЯЯ НАВИГАЦИЯ ---------- */
  nav { display:flex; background:rgba(20,20,40,.95); border-top:1px solid rgba(255,255,255,.1); }
  nav button {
    flex:1; padding:13px 4px; background:none; border:none; color:#889;
    font-size:14px; font-weight:600; cursor:pointer; font-family:inherit;
  }
  nav button.active { color:#ffd54a; }
</style>
</head>
<body>
<div class="app">

  <!-- ЭКРАН ТАПАТЬ -->
  <div class="tap-screen" id="tapScreen">
    <h1>🚗 Жигули Кликер</h1>
    <div class="score" id="score">0</div>
    <div class="per-tap">+<span id="perTap">1</span> за тап</div>
    <div class="car-circle" id="tapZone">🚗</div>
  </div>

  <!-- ЭКРАН ГАРАЖ -->
  <div class="screen" id="garageScreen">
    <h2>🔧 Твой гараж (<span id="garageCount">1</span>/99)</h2>
    <div id="carList"></div>
  </div>

  <!-- ЭКРАН ТЮНИНГ -->
  <div class="screen" id="tuneScreen">
    <h2>⚙️ Тюнинг</h2>
    <div id="tuneList"></div>
  </div>

  <!-- ЭКРАН ТОП -->
  <div class="screen" id="topScreen">
    <h2>🏆 Топ игроков</h2>
    <div class="empty">Пока в одиночном зачёте — ты и твой рекорд.<br>Скоро подключим общий сервер и посоревнуемся!</div>
  </div>

  <!-- НАВИГАЦИЯ -->
  <nav>
    <button class="active" data-tab="tapScreen">🚗 Тапать</button>
    <button data-tab="garageScreen">🔧 Гараж</button>
    <button data-tab="tuneScreen">⚙️ Тюнинг</button>
    <button data-tab="topScreen">🏆 Топ</button>
  </nav>
</div>

<script>
// ---------- ДАННЫЕ ----------
const CARS = [
  { id:'vaz2101',    name:'ВАЗ-2101 «Копейка»',  price:0,    emoji:'🚗' },
  { id:'vaz2106',    name:'ВАЗ-2106 «Шестёрка»', price:100,  emoji:'🚙' },
  { id:'vaz2109',    name:'ВАЗ-2109 «Девятка»',  price:300,  emoji:'🚕' },
  { id:'niva',       name:'Нива 2121',           price:700,  emoji:'🛻' },
  { id:'lada_vesta', name:'Lada Vesta',          price:1500, emoji:'🏎️' },
  { id:'belaz',      name:'БелАЗ (легенда)',     price:5000, emoji:'🚛' },
  { id:'oka',       name:'Ока',                       price:300,   emoji:'🚗' },
  { id:'vaz2107',   name:'ВАЗ-2107 «Семёрка»',        price:800,   emoji:'🚗' },
  { id:'vaz2114',   name:'ВАЗ-2114 «Четырнадцатая»',  price:1200,  emoji:'🚙' },
  { id:'buhanka',   name:'УАЗ «Буханка»',             price:2000,  emoji:'🚐' },
  { id:'gaz21',     name:'ГАЗ-21 «Волга»',            price:2500,  emoji:'🚘' },
  { id:'gaz24',     name:'ГАЗ-24',                    price:3500,  emoji:'🚘' },
  { id:'patriot',   name:'УАЗ «Патриот»',             price:4500,  emoji:'🚙' },
  { id:'granta',    name:'Лада Гранта',               price:6000,  emoji:'🚗' },
  { id:'largus',    name:'Лада Ларгус',               price:7000,  emoji:'🚓' },
  { id:'kamaz',     name:'КамАЗ',                     price:9000,  emoji:'🚛' },
  { id:'priora',    name:'⭐ Премиум Лада Приора',     price:15000, emoji:'🏎️' }
];

const UPGRADES = [
  { id:'engine',  name:'Спортивный движок', desc:'Классика: расточил мотор — больше тапов.',  base:50,  mult:1.6, effect:1 },
  { id:'turbo',   name:'Турбо-наддув',      desc:'Гоняет по парку с ветерком. +к тапам.',     base:150, mult:1.7, effect:3 },
  { id:'wheels',  name:'Литые диски',       desc:'Красота и аэродинамика за один присест.',   base:80,  mult:1.5, effect:2 },
  { id:'spoiler', name:'Спойлер «Кит-кат»', desc:'Прижимная сила растёт, тапы ускоряются.',   base:120, mult:1.6, effect:2 },
  { id:'sound',   name:'Дорогая музыка',    desc:'Басы в багажнике — тапы бьют сильнее.',     base:200, mult:1.8, effect:4 }
];

// ---------- СОСТОЯНИЕ ----------
const state = {
  taps: 0,
  activeCar: 'vaz2101',
  ownedCars: ['vaz2101'],
  upgrades: {}
};
UPGRADES.forEach(u => state.upgrades[u.id] = 0);

// ---------- ЗАГРУЗКА / СОХРАНЕНИЕ ----------
function save() {
  try { localStorage.setItem('zhiguli_save', JSON.stringify(state)); } catch(e){}
}
function load() {
  try {
    const s = JSON.parse(localStorage.getItem('zhiguli_save'));
    if (s) {
      Object.assign(state, s);
      UPGRADES.forEach(u => { if (state.upgrades[u.id] === undefined) state.upgrades[u.id] = 0; });
    }
  } catch(e){}
}

// ---------- ЛОГИКА ----------
function tapValue() {
  let v = 1;
  UPGRADES.forEach(u => v += u.effect * state.upgrades[u.id]);
  return v;
}
function upgradeCost(up) {
  return Math.round(up.base * Math.pow(up.mult, state.upgrades[up.id]));
}
function buyCar(car) {
  if (state.ownedCars.includes(car.id)) return;
  if (state.taps < car.price) return;
  state.taps -= car.price;
  state.ownedCars.push(car.id);
  state.activeCar = car.id;
  updateUI();
}
function buyUpgrade(up) {
  const cost = upgradeCost(up);
  if (state.taps < cost) return;
  state.taps -= cost;
  state.upgrades[up.id]++;
  updateUI();
}

// ---------- РЕНДЕР ----------
function renderCars() {
  const list = document.getElementById('carList');
  list.innerHTML = '';
  CARS.forEach((car, i) => {
    const owned = state.ownedCars.includes(car.id);
    const div = document.createElement('div');
    div.className = 'car-card ' + (owned ? 'owned' : (state.taps >= car.price ? '' : 'locked'));
    div.innerHTML = '<div class="car-name">' + car.emoji + ' ' + car.name + '</div>'
      + '<div class="car-price">'
      + (owned ? '<span class="owned-tag">Куплено' + (state.activeCar === car.id ? ' · ездим сейчас' : '') + '</span>'
               : car.price + ' тапов')
      + '</div>'
      + (owned ? '' : '<button class="buy-btn" data-car="' + i + '">Купить</button>');
    list.appendChild(div);
  });
  list.querySelectorAll('[data-car]').forEach(btn => {
    btn.onclick = () => buyCar(CARS[+btn.dataset.car]);
  });
  document.getElementById('garageCount').textContent = state.ownedCars.length;
}

function renderTunes() {
  const list = document.getElementById('tuneList');
  list.innerHTML = '';
  UPGRADES.forEach((up, i) => {
    const lvl = state.upgrades[up.id];
    const cost = upgradeCost(up);
    const div = document.createElement('div');
    div.className = 'tune-card';
    div.innerHTML = '<div class="tune-title">' + up.name + '<span class="tune-lvl">ур. ' + lvl + '</span></div>'
      + '<div class="tune-desc">' + up.desc + ' Сейчас: <b>+' + (up.effect * lvl) + '</b> к силе тапа.</div>'
      + '<button class="buy-btn" data-tune="' + i + '"' + (state.taps < cost ? ' disabled' : '') + '>'
      + 'Улучшить · ' + cost + ' тапов</button>';
    list.appendChild(div);
  });
  list.querySelectorAll('[data-tune]').forEach(btn => {
    btn.onclick = () => buyUpgrade(UPGRADES[+btn.dataset.tune]);
  });
}

function updateUI() {
  document.getElementById('score').textContent = state.taps;
  document.getElementById('perTap').textContent = tapValue();
  document.getElementById('tapZone').textContent = (CARS.find(c => c.id === state.activeCar) || CARS[0]).emoji;
  renderCars();
  renderTunes();
  save();
}

// ---------- ТАПЫ ----------
const tapZone = document.getElementById('tapZone');
function doTap(x, y) {
  state.taps += tapValue() + (state.activeCar === 'priora' ? 9 : 0);
  updateUI();
  const f = document.createElement('div');
  f.className = 'float';
  f.textContent = '+' + tapValue();
  f.style.left = (x - 10) + 'px';
  f.style.top = (y - 20) + 'px';
  document.body.appendChild(f);
  setTimeout(() => f.remove(), 800);
}
tapZone.addEventListener('pointerdown', e => doTap(e.clientX, e.clientY));

// ---------- ВКЛАДКИ ----------
document.querySelectorAll('nav button').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const tab = btn.dataset.tab;
    document.getElementById('tapScreen').style.display = (tab === 'tapScreen') ? 'flex' : 'none';
    ['garageScreen','tuneScreen','topScreen'].forEach(id => {
      document.getElementById(id).classList.toggle('active', id === tab);
    });
  };
});

// ---------- СТАРТ ----------
load();
updateUI();

// Telegram: на весь экран и без дрожания
if (window.Telegram && Telegram.WebApp) {
  Telegram.WebApp.expand();
  if (Telegram.WebApp.disableVerticalSwipes) Telegram.WebApp.disableVerticalSwipes();
}
// ===== СЕКРЕТНАЯ ПАНЕЛЬ ВЛАДЕЛЬЦА ======
const ADMIN_PASSWORD = '2026RRRFoks42'; // Твой пароль, не меняй пока, если не хочешь
let secretTaps = 0;
let secretTimer = null;

document.getElementById('score').addEventListener('click', () => {
  secretTaps++;
  clearTimeout(secretTimer);
  secretTimer = setTimeout(() => {
    secretTaps = 0;
  }, 2000);

  if (secretTaps >= 5) {
    secretTaps = 0;
    const pass = prompt('Режим владельца. Введите пароль:');
    
    if (pass === ADMIN_PASSWORD) {
      const input = prompt('Сколько тапов добавить?');
      const n = parseInt(input, 10);
      
      if (!isNaN(n) && n > 0) {
        if (typeof state !== 'undefined' && typeof state.taps !== 'undefined') {
          state.taps += n;
          save();
          updateUI();
          alert('Начислено: ' + n.toLocaleString('ru-RU') + ' тапов 🔧');
        } else {
          alert('Ошибка: не найдена переменная state.taps. Проверь начало файла!');
        }
      }
    }
  }
}); // <--- Вот эта скобка закрывает addEventListener. Она должна быть здесь и только здесь.
</script>
</body>
</html>
